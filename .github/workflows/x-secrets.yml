name: Set the Worker's X keys

# Copies the X app's OAuth 2.0 Client ID and Client Secret from this
# repository's Actions secrets into the Worker, so it can post flights to X
# for players who connect their account (see worker/src/xshare.ts).
#
# Manual, like worker-secret.yml, and for the same reason: it refuses to run
# with an empty value rather than writing the emptiness. Run it again after
# regenerating either key in the X developer console.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-secret
  cancel-in-progress: false

jobs:
  put:
    runs-on: ubuntu-latest

    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}

    steps:
      - name: Refuse to write nothing
        run: |
          missing=0
          for name in X_CLIENT_ID X_CLIENT_SECRET CF_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in this repository's Actions secrets (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      # printf rather than echo: a trailing newline would become part of the key.
      - name: Put the keys
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$X_CLIENT_ID" | npx wrangler secret put X_CLIENT_ID
          printf '%s' "$X_CLIENT_SECRET" | npx wrangler secret put X_CLIENT_SECRET

      - name: Report
        run: |
          {
            echo "### X keys are set"
            echo
            echo "Written to the **seat-airlines-banners** Worker; they take effect"
            echo "immediately. \`GET /x/status\` should now answer \`\"available\": true\`."
            echo
            echo "To post pictures only (cheaper), or to switch API posting off,"
            echo "set the Worker variable \`X_MEDIA\` to \`image\` or \`off\`."
          } >> "$GITHUB_STEP_SUMMARY"
