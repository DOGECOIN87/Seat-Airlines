name: Set a Worker secret

# Putting a Worker secret in place without a Cloudflare login.
#
# `wrangler secret put` run by hand opens an OAuth flow whose callback is a
# listener on localhost, which is no use from a Codespace, a phone, or any
# other machine that is not the one holding the browser. This repository
# already has a Cloudflare token that can do the job — it is what deploys the
# Worker — so the work happens here, where that token lives.
#
# ── Why this is its own workflow, and manual ──────────────────────────────
# `worker.yml` says plainly why RPC_URL is not pushed on every deploy: an
# unset repository secret would write an empty string on each one, and an
# empty RPC_URL reads to the Worker as "there is no endpoint", which turns the
# holder check off without saying so. That argument is about *every deploy*.
#
# This runs only when somebody asks it to, refuses outright when the value is
# empty rather than writing the emptiness, and touches nothing else. Both
# things stay true at once.
on:
  workflow_dispatch:
    inputs:
      secret:
        description: Which secret to copy from this repository's Actions secrets into the Worker
        type: choice
        default: RPC_URL
        options:
          - RPC_URL
          # Turns on email, passkey and SMS sign-in (worker/src/helius.ts).
          - HELIUS_API_KEY

permissions:
  contents: read

concurrency:
  group: worker-secret
  cancel-in-progress: false

jobs:
  put:
    runs-on: ubuntu-latest

    # No job-level working-directory, deliberately. The guard below runs
    # before the checkout — the whole point of it being first — and a default
    # pointing into the repository fails such a step before its first line,
    # because the directory it names does not exist yet. The two steps that
    # genuinely need `worker/` say so themselves.

    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NAME: ${{ inputs.secret || 'RPC_URL' }}
      # Both are passed in and one is chosen below, rather than picked here
      # with `&&`/`||`: an unset secret is an empty string, which is falsy, so
      # that idiom would quietly fall through to the other secret's value.
      IN_RPC_URL: ${{ secrets.RPC_URL }}
      IN_HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

    steps:
      # Checked before anything is installed, so a missing value costs a
      # couple of seconds rather than a build.
      - name: Refuse to write nothing
        run: |
          case "$NAME" in
            HELIUS_API_KEY) VALUE="$IN_HELIUS_API_KEY" ;;
            RPC_URL) VALUE="$IN_RPC_URL" ;;
            *) echo "::error::Unknown secret name: $NAME"; exit 1 ;;
          esac
          if [ -z "$VALUE" ]; then
            echo "::error::$NAME is not set in this repository's Actions secrets."
            echo "Add it under Settings → Secrets and variables → Actions →"
            echo "Secrets, or from a terminal:"
            echo
            echo "  gh secret set $NAME --body '...'"
            exit 1
          fi
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set, so there is nothing to write with."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      # printf rather than echo: a trailing newline would be part of the URL,
      # and a URL with a newline in it fails in a way nothing reports.
      - name: Put the secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$NAME" = "HELIUS_API_KEY" ]; then VALUE="$IN_HELIUS_API_KEY"; else VALUE="$IN_RPC_URL"; fi
          printf '%s' "$VALUE" | npx wrangler secret put "$NAME"

      # What was written, never what it says. The whole point of a secret is
      # that it does not appear in a log that anybody can read.
      - name: Report
        run: |
          {
            echo "### $NAME is set"
            echo
            echo "Written to the **seat-airlines-banners** Worker. It takes effect"
            echo "immediately; no redeploy is needed."
            echo
            if [ "$NAME" = "HELIUS_API_KEY" ]; then
              echo "To check it took, \`GET /health\` should report \`embeddedWallets: true\`,"
              echo "and the wallet picker should offer **Email or passkey**."
            else
              echo "To check it took, \`GET /health\` should report \`sections: true\`,"
              echo "and the seat map should fill past twenty within a minute or so."
            fi
            echo
            echo "You can delete the \`$NAME\` Actions secret afterwards if you"
            echo "would rather it lived in only one place — Cloudflare keeps its"
            echo "own copy, and this workflow is only needed again to change it."
          } >> "$GITHUB_STEP_SUMMARY"
