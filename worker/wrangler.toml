name = "seat-airlines-banners"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# The published wall: one small JSON record per wallet.
[[kv_namespaces]]
binding = "BANNERS"
id = "0767939f209a41ab9692f2b1b1550c05"

# The artwork.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "seat-airlines-banners"

# The cabin directory: holder cards and the introductions between them.
#
# The database exists and `migrations/0001_networking.sql` has been applied to
# it, so this binding is live: deploying with it wired up turns the directory
# on. Until this deploy lands, the routes answer 503 saying there is none.
#
# A binding naming a database that does not exist fails the deploy outright,
# and this file is what CI deploys on every push — so if you ever point it at
# a fresh database, create that database first.
[[d1_databases]]
binding = "DIRECTORY"
database_name = "seat-airlines-directory"
database_id = "a8e4747a-ef46-4689-ac75-c50f7f428b83"

# How often one address may make GET /holding ask the chain for a wallet that
# is not on the holder list: each is a metered RPC call. Seated wallets are
# answered from the list and never count. (Cloudflare's rate-limit binding;
# the namespace is any number unique to this account.)
[[ratelimits]]
name = "HOLDING_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
# The Worker uses R2 only when this is set as well as the binding above, and
# falls back to serving images out of KV when it is not. That is deliberate:
# R2 is useful here precisely because images can be read straight from the
# bucket without touching the Worker, and that needs a public URL. A bound
# bucket with no public URL would mean paying R2's write path for none of its
# read benefit.
#
# To enable:
#   Cloudflare dashboard → R2 → seat-airlines-banners → Settings →
#   Public access → Allow Access → copy the pub-*.r2.dev URL, then:
#
PUBLIC_IMAGE_BASE = "https://pub-7bcf6d5d613c464da99814dd49b0f3ff.r2.dev"
#
# Until this is set, images are served through the Worker from KV — correct,
# but it keeps the Worker on the read path for every image request.

# The origins allowed to call this. Left empty the Worker echoes whatever
# origin asks, which is fine locally and careless in production.
ALLOWED_ORIGINS = "https://seat-airlines.space,https://www.seat-airlines.space"

# Posting flights to X for players who connect their account (src/xshare.ts).
# "video" posts the flight's video, and the card if X will not take it;
# "image" posts the card only, which costs fewer API calls; "off" stops API
# posting, and every Post opens X's own compose box with the card's link.
# The keys are secrets, set by the "Set the Worker's X keys" workflow.
X_MEDIA = "image"

# The holder list, for the directory's section rules: who may read whose card,
# and whose conversations carry forward. **Point this at the same feed as the
# page's VITE_HOLDERS_URL** — one feed is what keeps one seating chart, and
# two would be the drift this service spent its life avoiding.
#
# Genuinely optional now. Unset, the ladder asks whichever token program owns
# the mint below for every account it holds of it, and sums them by owner —
# the whole holder list rather than the twenty `getTokenLargestAccounts`
# caps at — and the page reads the result back from this Worker's own
# GET /holders, so the two cannot disagree about who is aboard.
#
# An indexer is still cheaper than a scan, so set one if you have one.
#
# Without even a mint the directory cannot tell one cabin from another, so it
# withholds every card's contact details from everybody but their owner, shows
# nobody another wallet's conversations, and refuses introductions rather than
# delivering one it cannot place. That is the safe direction to fail in, and
# `GET /health` reports `sections` either way — and `seated` out of `cabin`
# beside it, because a cabin that fills to twenty of a hundred and seventy-
# eight is the other way this goes quietly wrong.
#
# MANIFEST_SIZE must match the page's VITE_MANIFEST_SIZE. Both default to the
# whole aircraft — 178 — read from the same constant in the shared seating
# module, so leaving both unset is the one way they cannot disagree.
# HOLDERS_URL = "https://…"
# MANIFEST_SIZE = "178"

# The token. Together with the RPC_URL secret below, lets the Worker refuse
# adverts from wallets that do not hold it; without that secret the check is
# skipped, and adverts from non-holders still never display on the page.
TOKEN_MINT = ""
# RPC_URL is a secret (paid endpoints carry an API key in the URL):
#
#   npx wrangler secret put RPC_URL
#   → https://mainnet.helius-rpc.com/?api-key=<YOUR_HELIUS_KEY>
#
# This is also the page's endpoint at one remove: the page reads balances and
# the holder list from this Worker rather than opening an RPC of its own,
# because a VITE_ variable carrying an API key is a key published to every
# visitor. Leave VITE_RPC_URL unset and set this.
#
# The Worker tries Helius's indexed `getTokenAccounts` first (cheaper, uses
# their DAS index) and falls back to the standard `getProgramAccounts` scan
# for any non-Helius endpoint. Both paths cache the result for LADDER_CACHE_MS
# (default 120 s) and share it between every copy of the Worker through the
# DIRECTORY database, so peak traffic costs one scan every two minutes for the
# whole site rather than one per visitor, or one per copy.
#
# Unset, the Worker falls back to Solana's public endpoint — which rate-limits
# the expensive holder scan and caps the cabin at twenty. `GET /health` reports
# `seated` out of `cabin`; anything well below the full aircraft means the scan
# is being refused and the endpoint needs to be set.

# The one wallet the operator's things belong to:
#
#   · the logbook — private notes, at GET/POST/PATCH/DELETE /logbook. Unset,
#     that route does not exist: no logbook, and the same 404 for everybody.
#   · the flight controls — PUT /flight, which rolls the aeroplane on every
#     visitor's page. GET /flight is public either way.
#
# A public key rather than a secret, and deliberately kept in the open here.
# It is on the chain, and drawn on this aircraft's own seat map if the
# operator holds the token, so hiding it would buy nothing — what guards those
# notes is the signature that opens a session, which needs the private key.
# Move it to `wrangler secret put ADMIN_WALLET` if you would rather it were
# not in the repository; the code reads it the same either way.
ADMIN_WALLET = "Hn1i7bLb7oHpAL5AoyGvkn7YgwmWrVTbVsjXA1LYnELo"
